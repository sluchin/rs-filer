# Dependabot: 依存の更新を, 週に 1 回 PR にする (マイナー版とパッチ版は, 種類ごとに 1 つの PR にまとめる).
# PR では, いつもの CI が走る. マージは手で行う.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    ignore:
      # @types/node は, CI の Node.js (22) と同じメジャー版にする.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 は, typescript-eslint が対応するまで上げない.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # ESLint 10 は, eslint-plugin-react が対応するまで上げない.
      - dependency-name: "eslint"
        versions: [">= 10.0.0"]
      # @eslint/js は, ESLint と同じ版にする.
      - dependency-name: "@eslint/js"
        versions: [">= 10.0.0"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # 一緒に上げないと, 版がずれて動かない組 (メジャー版も含めて, 1 つの PR にする).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
