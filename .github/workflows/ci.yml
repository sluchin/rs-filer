name: CI

# main への push と, すべての pull request で実行する.
on:
  push:
    branches:
      - main
  pull_request:

# 同じブランチで新しい実行が始まったら, 古い実行を取り消す.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      # リポジトリを取得する.
      - uses: actions/checkout@v5

      # npm run check のフロントエンド部分 (tsc, vite, eslint, vitest) に使う.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      # npm run check のバックエンド部分 (clippy, cargo test, cargo fmt) に使う.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # src-tauri のビルド成果物をキャッシュし, 以降の実行を速くする.
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: "v2-rust-cache"

      # Tauri のビルドに必要な Linux のシステムライブラリ
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # package-lock.json どおりに依存をインストールする.
      - name: Install frontend dependencies
        run: npm ci

      # cargo clippy / cargo test は tauri.conf.json の frontendDist (dist) を参照するため, 先にビルドする.
      - name: Build frontend
        run: npm run build

      # 整形チェック, eslint, clippy, vitest, cargo test, cargo fmt --check
      - name: Check
        run: npm run check

  deploy-docs:
    needs: check  # checkが成功した後に実行
    runs-on: ubuntu-22.04
    # GitHub Pagesへデプロイするために必要な権限
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Node.jsのセットアップ（npmを使うため）
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      # フロントエンドやドキュメント用の依存関係インストール
      - name: Install dependencies
        run: npm ci

      # npm を使ってドキュメントをビルド
      - name: Build documentation
        run: npm run doc  # package.json の "doc" スクリプトが実行されます

      # GitHub Pages用に成果物をアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html  # ※実際にビルドされたHTMLが出力されるフォルダのパスに合わせて変更してください

      # GitHub Pagesへデプロイ
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
