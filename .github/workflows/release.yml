name: Release

on:
  push:
    tags:
      - 'v*' # vから始まるタグ（例: v0.1.0）がプッシュされたときに実行
  # 手動実行. タグを打たずにビルドし, 成果物を Actions の Artifacts からダウンロードできる.
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write # GitHub Releasesへの書き込み権限に必要
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # 1. Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm' # または 'pnpm', 'yarn'

      # 2. Rustのセットアップ
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin は Rust のターゲットではないため, macOS は 2 つのアーキテクチャを個別に入れる.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      # 3. Rustのビルドキャッシュ（高速化）
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # 4. Linux環境のみ必要なシステム依存関係のインストール
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # 5. フロントエンドの依存関係インストールとビルド
      - name: Install frontend dependencies
        run: npm install # または pnpm install / yarn install

      # 6. Tauriアプリのビルド (deb / rpm / AppImage / msi / nsis / dmg)
      #    タグ実行時は GitHub Releases のドラフトへアップロードする. 手動実行時はアップロードしない.
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'rsfiler ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # 7. Windows: インストーラとは別に, exe 単体のポータブル版 zip を作る
      - name: Create Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = "rsfiler_${{ github.ref_name }}_windows_x64_portable.zip"
          Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/rsfiler.exe" -DestinationPath $zip
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable zip to release
        if: matrix.os == 'windows-latest' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" $env:PORTABLE_ZIP --clobber

      # 8. 成果物を Artifacts にも保存する (手動実行時はここからダウンロードする)
      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rsfiler-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ${{ env.PORTABLE_ZIP }}
          if-no-files-found: error
